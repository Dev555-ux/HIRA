# Nginx reverse proxy + TLS termination in front of the `api` container.
# Templated via the official nginx:alpine image's entrypoint: ${API_DOMAIN}
# below is substituted from the `nginx` service's environment (docker-compose
# .prod.yml) at container start — no manual editing needed per deploy.
#
# Certbot's `certonly --standalone` needs port 80 free on first run (before
# this config exists) — see documentation/DEPLOYMENT_AWS.md for the
# chicken-and-egg bootstrap sequence. After that, Certbot's ACME HTTP-01
# renewal challenge is served from /var/www/certbot (the webroot method)
# instead, so renewals don't need to stop nginx.

# Standard WebSocket-upgrade map (http context, applies to both server
# blocks below) — Connection: upgrade only when the client actually sent
# Upgrade; otherwise a normal keep-alive/close, matching a plain HTTP
# request. Used by the proxied location's Upgrade/Connection headers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ${API_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker healthcheck target (docker-compose.prod.yml's nginx service) —
    # answered directly by nginx itself, not proxied, so it stays healthy
    # even if `api` is briefly down (that's what the api healthcheck is for).
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Every KB entry/message body here is plain JSON text (no file-upload
    # endpoints exist in this API — see app/api/knowledge_base.py), so 10m is
    # a generous ceiling, not a tuned limit for large uploads.
    client_max_body_size 10m;

    # Docker's embedded DNS server, reachable inside every container on this
    # project's default Compose network (the same mechanism that already
    # lets `api`/`postgres` resolve by service name at all). A bare hostname
    # in proxy_pass (no variable) resolves exactly once, when a worker
    # process starts, and is then cached in memory for that worker's entire
    # life — recreating the `api` container (`docker compose up -d --build
    # api`) gives it a new IP that a live nginx worker never learns about,
    # so it keeps proxying to a dead address until something forces a fresh
    # resolution (previously: a manual `docker compose restart nginx`).
    # Using a variable below defers resolution to request time through this
    # resolver instead of config-load time, so a recreated container is
    # picked up automatically within `valid` — no nginx restart required.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;

        # Real client IP + protocol, read by uvicorn's --proxy-headers
        # (docker-compose.prod.yml's api command) — without these, every
        # request's client IP as seen by FastAPI would be nginx's own
        # container IP, silently breaking the IP-scoped rate limit on
        # business creation (app/core/rate_limit.py).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/SSE-ready: no route uses either today (grepped app/ —
        # no websocket/EventSourceResponse/StreamingResponse), but a plain
        # HTTP-only proxy_pass silently breaks a `ws://`/`wss://` upgrade the
        # moment one is added, so this costs nothing to have ready now.
        # $connection_upgrade is defined in the map{} block below.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # Long enough to not kill a slow LLM-backed response or a future
        # long-lived WebSocket/SSE connection; Nginx resets this timer on
        # every byte sent, so an actively streaming response is unaffected.
        proxy_read_timeout 300s;
    }
}
