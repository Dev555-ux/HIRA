[project]
name = "hira-backend"
version = "0.1.0"
description = "HIRA backend — AI Receptionist API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "fastembed>=0.3",
    "anthropic>=0.40",
    "openai>=1.40",
]

[tool.setuptools.packages.find]
# Only "app" is our importable package. Without this, setuptools also sees the
# "alembic" migrations folder and errors on ambiguous flat-layout discovery.
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uvicorn]
# Run locally with: uvicorn app.main:app --reload

[tool.ruff]
line-length = 100
# Alembic migration scripts are autogenerated; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
