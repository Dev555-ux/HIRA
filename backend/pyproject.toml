[project]
name = "hira-backend"
version = "0.1.0"
description = "HIRA backend — AI employee platform API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "httpx>=0.27",
    "fastembed>=0.3",
    "anthropic>=0.40",
    "groq>=0.11",
    "pyjwt[crypto]>=2.8",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.146",
    "sentry-sdk[fastapi]>=2.14",
    "slowapi>=0.1.9",
]

[tool.setuptools.packages.find]
# Only "app" is our importable package. Without this, setuptools also sees the
# "alembic" migrations folder and errors on ambiguous flat-layout discovery.
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Exact pin: CI and local installs both come from this file, so an unpinned
    # range let CI silently pick up newer Ruff releases with different lint results.
    "ruff==0.16.7",
    "httpx>=0.27",
]

[tool.uvicorn]
# Run locally with: uvicorn app.main:app --reload

[tool.ruff]
line-length = 100
# Alembic migration scripts are autogenerated; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Explicit rather than Ruff's default: 0.16 widened the default rule set (390 new
# findings here), so the rules enforced should change only when this list does.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
