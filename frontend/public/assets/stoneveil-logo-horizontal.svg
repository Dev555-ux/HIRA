<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <!-- STONEVEIL HORIZONTAL LOCKUP: Brand Guideline Compliant -->
  <!-- 1. Emblem (Sword & Facets) -->
  <g transform="translate(4, 2) scale(0.68)">
    <!-- Facets -->
    <polygon points="12,70 38,70 30,36" fill="#1C1C22" stroke="#2D2D38" stroke-width="0.75" />
    <polygon points="30,36 38,70 54,70 46,28" fill="#3D3D48" stroke="#4A4A56" stroke-width="0.75" />
    <polygon points="46,28 38,70 54,70" fill="#E8E8EE" stroke="#D0D0D8" stroke-width="0.75" />
    <polygon points="36,70 48,42 46,28" fill="#F4F4F8" />
    <polygon points="46,28 54,70 78,70 60,38" fill="#E72F13" stroke="#B8220C" stroke-width="0.75" />

    <!-- Sword -->
    <g transform="rotate(-8 42 35)">
      <polygon points="42,4 44.5,7 42,10 39.5,7" fill="#F0F0F4" stroke="#121216" stroke-width="1.2" />
      <rect x="41" y="9" width="2" height="6" fill="#D0D0D6" stroke="#121216" stroke-width="0.8" />
      <polygon points="34,14 50,14 48.5,17 35.5,17" fill="#F4F4F8" stroke="#121216" stroke-width="1.2" />
      <polygon points="40,17 42,17 42,48 40,40" fill="#FFFFFF" stroke="#121216" stroke-width="1" />
      <polygon points="42,17 44,17 44,40 42,48" fill="#D4D4DC" stroke="#121216" stroke-width="1" />
      <line x1="42" y1="17" x2="42" y2="48" stroke="#121216" stroke-width="0.9" />
    </g>
  </g>

  <!-- 2. Wordmark STONEVEIL -->
  <text x="70" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0.06em">STONEVEIL</text>

  <!-- 3. Tagline (Rule: Tagline appears only on wide lockups) -->
  <text x="71" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#9E9EA8" letter-spacing="0.16em">ENGINEERING THE FUTURE OF WORK</text>
</svg>

